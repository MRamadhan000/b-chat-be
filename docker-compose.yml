version: '3.8'

services:
  chat-postgres:
    image: postgres:13
    container_name: chat_postgres_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: bchat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

    ports:
      - "5434:5432"

    volumes:
      - chat_postgres_data:/var/lib/postgresql/data

volumes:
  chat_postgres_data:
    name: chat_postgres_data